name: Release

# Tag a version to ship everything:
#   git tag v0.3.0 && git push origin v0.3.0
#
# Produces a GitHub Release with: VS Code .vsix, browser extension zip,
# JetBrains plugin zip — and publishes the Docker image to GHCR.
#
# Store publishing activates automatically when you add repo secrets:
#   VSCE_PAT        → VS Code Marketplace  (https://marketplace.visualstudio.com/manage)
#   OVSX_PAT        → Open VSX / Cursor & co. (https://open-vsx.org)
# Chrome Web Store / Firefox AMO / JetBrains Marketplace need one-time manual
# uploads of the artifacts below; their review flows aren't secret-only.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  artifacts:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VS Code extension (.vsix)
        working-directory: integrations/vscode
        run: npx --yes @vscode/vsce@latest package --out "$RUNNER_TEMP/sovereignai-${GITHUB_REF_NAME#v}.vsix"

      - name: Zip browser extension
        working-directory: integrations/browser
        run: zip -r "$RUNNER_TEMP/sovereignai-browser-${GITHUB_REF_NAME#v}.zip" manifest.json background.js popup.html popup.js icons

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build JetBrains plugin
        run: gradle buildPlugin --no-daemon
        working-directory: integrations/jetbrains

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SovereignAI $GITHUB_REF_NAME" \
            --generate-notes \
            "$RUNNER_TEMP/sovereignai-${GITHUB_REF_NAME#v}.vsix" \
            "$RUNNER_TEMP/sovereignai-browser-${GITHUB_REF_NAME#v}.zip" \
            integrations/jetbrains/build/distributions/*.zip

      - name: Publish to VS Code Marketplace (when VSCE_PAT secret exists)
        working-directory: integrations/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT not set — skipping marketplace publish"; exit 0; fi
          npx --yes @vscode/vsce@latest publish -p "$VSCE_PAT"

      - name: Publish to Open VSX (when OVSX_PAT secret exists)
        working-directory: integrations/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT not set — skipping Open VSX publish"; exit 0; fi
          npx --yes ovsx publish "$RUNNER_TEMP/sovereignai-${GITHUB_REF_NAME#v}.vsix" -p "$OVSX_PAT"

  binaries:
    # Single-file executables (Node SEA). Waits for `artifacts` because that
    # job creates the GitHub Release these binaries are uploaded into.
    needs: [test, artifacts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm   # linux-arm64: DGX Spark, Graviton, Raspberry Pi 5
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and smoke-test single binary
        run: node scripts/build-sea.mjs
      - name: Upload binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/sovereign-v* --clobber

  checksums:
    # Runs after every asset is attached: one SHA256SUMS.txt over all of them,
    # optionally minisign-signed. Verification instructions live in
    # docs/OPERATIONS.md#verifying-release-downloads.
    needs: [artifacts, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
      - name: Write SHA256SUMS.txt
        run: cd assets && sha256sum * > ../SHA256SUMS.txt && cat ../SHA256SUMS.txt
      - name: Sign checksums (when MINISIGN_SECRET_KEY secret exists)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "MINISIGN_SECRET_KEY not set — publishing unsigned checksums"; exit 0; fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          minisign -S -s minisign.key -W -m SHA256SUMS.txt -t "SovereignAI $GITHUB_REF_NAME"
          rm -f minisign.key
      - name: Upload checksums (and signature if created)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="SHA256SUMS.txt"
          [ -f SHA256SUMS.txt.minisig ] && files="$files SHA256SUMS.txt.minisig"
          gh release upload "$GITHUB_REF_NAME" $files --clobber --repo "$GITHUB_REPOSITORY"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One manifest, two platforms: amd64 for the RTX desktop and workstation,
      # arm64 for the DGX Spark and Apple-silicon Docker hosts. The base image
      # (node:22-alpine) ships both; the app has no native code to cross-compile.
      - name: Build and push a multi-arch image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest" --push .
