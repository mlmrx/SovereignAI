# SovereignAI in Docker.
#
#   SOVEREIGN_TOKEN=$(openssl rand -hex 24) docker compose up -d
#   → open http://localhost:4321/?token=<your token>
#
# With a containerized Ollama too (pulls models into the ollama volume):
#   docker compose --profile ollama up -d
#   docker compose exec ollama ollama pull llama3.1
services:
  sovereign:
    build: .
    ports:
      - "4321:4321"
    environment:
      SOVEREIGN_TOKEN: ${SOVEREIGN_TOKEN:?set SOVEREIGN_TOKEN to protect remote access}
      # default: talk to Ollama on the host machine; the ollama profile overrides this
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sovereign-data:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  sovereign-data:
  ollama-models:
