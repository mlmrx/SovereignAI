# SovereignAI in Docker.
#
# Containerized Ollama (recommended; Sovereign reaches http://ollama:11434):
#   export SOVEREIGN_TOKEN="$(openssl rand -hex 24)"
#   echo "Save: http://localhost:4321/#token=$SOVEREIGN_TOKEN"
#   docker compose --profile ollama up -d
#
# Pull models into the durable Ollama volume:
#   docker compose exec ollama ollama pull llama3.1
#
# The containerized Ollama below runs on the CPU. To give it the GPU, add the
# overlay (NVIDIA Container Toolkit required — see docker-compose.gpu.yml):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#     --profile ollama up -d
# It is a separate file because a GPU reservation on a host without the
# toolkit fails the whole "up" rather than falling back to the CPU.
#
# To use Ollama running on the HOST instead, do not enable the profile and set:
#   OLLAMA_BASE_URL=http://host.docker.internal:11434
# Example:
#   SOVEREIGN_TOKEN=... OLLAMA_BASE_URL=http://host.docker.internal:11434 docker compose up -d
services:
  sovereign:
    build: .
    ports:
      - "4321:4321"
    environment:
      SOVEREIGN_TOKEN: ${SOVEREIGN_TOKEN:?set SOVEREIGN_TOKEN to protect remote access}
      SOVEREIGN_HOME: /state
      # Default is the profiled Ollama service. Override explicitly for host Ollama (above).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # FreeToken on the Docker host (start it with `ft serve --host 0.0.0.0`; empty keeps the provider off)
      FREETOKEN_BASE_URL: ${FREETOKEN_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Config and all future state live in sovereign-state. The nested data
      # volume preserves compatibility with the previous /app/data mount.
      - sovereign-state:/state
      - sovereign-data:/state/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    # CPU-only as written. docker-compose.gpu.yml adds the NVIDIA reservation.
    restart: unless-stopped

volumes:
  sovereign-state:
  sovereign-data:
  ollama-models:
