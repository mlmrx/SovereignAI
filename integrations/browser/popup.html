<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 380px; height: 520px; margin: 0; display: flex; flex-direction: column;
           font: 13px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6e9ee; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 10px 12px; border-bottom: 1px solid #2a3340; }
    header .brand { font-weight: 700; }
    header .brand span { color: #d9a441; }
    header a { color: #9aa4b2; font-size: 11px; text-decoration: none; }
    header a:hover { color: #d9a441; }
    #log { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { margin-bottom: 12px; white-space: pre-wrap; overflow-wrap: break-word; }
    .msg.user { color: #7aa2f7; }
    .msg.user::before { content: "you  "; opacity: 0.5; font-size: 11px; }
    .msg.ai::before { content: "⬡  "; color: #d9a441; }
    .msg.err { color: #e5534b; }
    #empty { color: #9aa4b2; text-align: center; margin-top: 140px; }
    footer { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #2a3340; }
    textarea { flex: 1; resize: none; background: #151b23; color: #e6e9ee; border: 1px solid #2a3340;
               border-radius: 6px; padding: 7px 9px; font-family: inherit; font-size: 13px; }
    textarea:focus { outline: none; border-color: #8a6a2c; }
    button { background: #d9a441; color: #1a1405; border: 0; border-radius: 6px; padding: 0 14px;
             font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #settings { padding: 12px; border-top: 1px solid #2a3340; display: none; }
    #settings input { width: 100%; box-sizing: border-box; background: #151b23; color: #e6e9ee;
                      border: 1px solid #2a3340; border-radius: 6px; padding: 6px 8px; }
    #settings label { font-size: 11px; color: #9aa4b2; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span>⬡</span> SovereignAI</div>
    <div>
      <a href="#" id="open-ui">web ui</a> ·
      <a href="#" id="toggle-settings">server</a>
    </div>
  </header>
  <div id="log"><div id="empty">Ask your own AI anything.<br/>Private. Local. Yours.</div></div>
  <div id="settings">
    <label>Server URL <input id="server-url" placeholder="http://127.0.0.1:4321" /></label>
  </div>
  <footer>
    <textarea id="in" rows="2" placeholder="Message your AI…"></textarea>
    <button id="send">Send</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
